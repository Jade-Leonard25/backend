name: Deploy client to GitHub Pages

on:
  # Only redeploy when the client (or this workflow) changes
  push:
    branches: ["main"]
    paths:
      - "client/**"
      - ".github/workflows/deploy-client.yml"
  # Lets you run it by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that is already running
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public URL of your deployed backend (set it under Settings > Variables)
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # Pages answers unknown paths with 404.html; serving the app there makes
      # vue-router history mode survive a refresh. Harmless if you use hash mode.
      - name: SPA fallback
        run: cp client/dist/index.html client/dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
